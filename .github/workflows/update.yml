name: Daily update
on:
  schedule:
    - cron: "40 17 * * 0-4"   # 19:40 Cairo (UTC+2), Sunday to Thursday, after the EGX close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Carry yesterday's news reading forward
        run: python3 -c "import json; d=json.load(open('data.json')); json.dump(d['latest']['news_assessment'], open('news_assessment.json','w'))"
      - name: Fetch prices and news, rescore the signal
        run: |
          cp data.json prev.json
          python3 engine.py --prev prev.json --out data.json --news-assessment news_assessment.json
          rm prev.json news_assessment.json
      - name: Commit the new reading
        run: |
          git config user.name "isph-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily ISPH update"
          git push
