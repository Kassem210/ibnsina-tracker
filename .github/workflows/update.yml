name: Daily update
on:
  schedule:
    - cron: "40 17 * * 0-4"   # 19:40 Cairo (UTC+2), Sunday to Thursday, after the EGX close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and news, rescore both stocks
        run: |
          for s in isph actf; do
            S=$(echo "$s" | tr a-z A-Z)
            cp "data-$s.json" prev.json
            # carry the last written news reading forward; this job cannot read the news itself
            python3 -c "import json; json.dump(json.load(open('prev.json'))['latest']['news_assessment'], open('news.json','w'))"
            python3 engine.py --symbol "$S" --prev prev.json --out "data-$s.json" --news-assessment news.json
          done
          rm -f prev.json news.json
      - name: Commit the new reading
        run: |
          git config user.name "isph-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data-isph.json data-actf.json
          git diff --cached --quiet || git commit -m "Daily tracker update"
          git push
